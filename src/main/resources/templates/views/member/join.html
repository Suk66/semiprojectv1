<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}"> <!--5-1 -->

            <th:block layout:fragment="content">
            <main id="content">



            </main>

                <main id="content" layout:fragment="content">
                    <h2>회원가입</h2>
                    <form name="joinfrm" id="joinfrm" method="post">

                        <div>
                        <label for="userid">아이디</label>
                        <input type="text" name="userid" id="userid">
                        </div>

                        <div>
                        <label for="password">비밀번호</label>
                        <input type="password" name="password" id="password">
                        </div>

                        <div>
                        <label for="repassword">비밀번호 확인</label>
                        <input type="password" name="repassword" id="repassword"></div>

                        <div>
                        <label for="name">이름</label>
                        <input type="text" name="name" id="name">
                        </div>

                        <div>
                        <label for="email">이메일</label>
                        <input type="text" name="email" id="email">
                        </div>

                        <div>
                            <img src="/image/captcha.png">
                        </div>

                        <div>
                            <button type="submit">입력완료</button>
                            <button type="reset">다시작성</button>

                        </div>




                    </form>


                </main>
                <!--</th:block> -->>


 <th:block layout:fragment="script">
    <script>
        const joinfrm = document.querySelector('#joinfrm');

        <!-- 최신 버전 -->
        joinfrm.addEventListener("submit", <!--function--> (e) => {
        //  구버전.. function joinform() {
            e.preventDefault(); // submit 버튼 기능 중지 했기 때문에.

            if (joinfrm.userid.value === '') {
                alert('아이디를 입력하세요 !!!');
                return false;   // 다시 돌아가서 다시 작성하게 유도.
            } else if (joinfrm.password.value === '') {
                alert('비밀번호를를 입력하세요 !!!');
                return false;   // 다시 돌아가서 다시 작성하게 유도.
            } else if (joinfrm.name.value === '') {
                alert('이름을 입력하세요 !!!');
                return false;   // 다시 돌아가서 다시 작성하게 유도.
            } else if (joinfrm.email.value === '') {
                alert('이메일를 입력하세요 !!!');
                return false;   // 다시 돌아가서 다시 작성하게 유도.
            } else if (joinfrm.password.value !== joinfrm.repassword.value) {
                alert('비밀번호가 서로 일치하지 않습니다.');
                return false;   // 다시 돌아가서 다시 작성하게 유도.
            }

            joinfrm.submit();   // 회원정보를 정삭적으로 작성완료.
        });
    </script>
</th:block>
</html>
